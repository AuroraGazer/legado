name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 3.26.0801
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ./key.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release configuration
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          for secret_name in \
            ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS \
            ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD \
            ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

          if [[ -z "$RELEASE_KEY_STORE_B64" ]]; then
            echo "Missing required GitHub Actions secret: RELEASE_KEY_STORE"
            exit 1
          fi
        env:
          RELEASE_KEY_STORE_B64: ${{ secrets.RELEASE_KEY_STORE }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEY_STORE_B64: ${{ secrets.RELEASE_KEY_STORE }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEY_STORE_B64" | base64 --decode > app/key.jks

      - name: Set release version
        shell: bash
        run: |
          sed -i "/def version/c\def version = \"$VERSION\"" app/build.gradle

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --stacktrace

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          apk_path="$(find app/build/outputs/apk/app/release -maxdepth 1 -type f -name 'legado_app_*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "Signed release APK was not produced."
            exit 1
          fi

          keytool -printcert -jarfile "$apk_path" > /dev/null
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado-${{ env.VERSION }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: legado_app_${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f app/key.jks
